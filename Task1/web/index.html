<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Number</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <h1>Guess the Number</h1>
    <p class="instructions">Guess the number between 1 and 100. You have <span id="attempts-left">7</span> attempts.</p>
    <p class="score-display">Score: <span id="total-score">0</span></p>

    <form id="guess-form" novalidate>
      <label for="guess-input">Your guess</label>
      <input type="number" id="guess-input" name="guess" min="1" max="100" placeholder="1–100" autocomplete="off" aria-describedby="message">
      <button type="submit" id="guess-btn">Guess</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div id="play-again-section" class="play-again-section" hidden>
      <button type="button" id="play-again-btn">Play again</button>
    </div>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
